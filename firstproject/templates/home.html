{% extends 'base.html' %}

{% block title %}Calculator Demonstration{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6">
        <div class="card card-custom p-4">
            <div class="text-center mb-4">
                <div class="stat-icon bg-primary-subtle text-primary mx-auto mb-2">
                    <i class="bi bi-calculator"></i>
                </div>
                <h3 class="fw-bold mb-1">Simple Calculator</h3>
                <p class="text-muted">Hello <strong>{{ name }}</strong>! Enter two numbers to calculate their sum.</p>
            </div>

            <form action="{% url 'add' %}" method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Enter First Number</label>
                    <input type="number" step="any" name="num1" class="form-control" placeholder="e.g. 15" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Enter Second Number</label>
                    <input type="number" step="any" name="num2" class="form-control" placeholder="e.g. 27" required>
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-plus-lg me-1"></i> Calculate Sum
                    </button>
                    <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i> Return to Student Dashboard
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
