{% extends 'base.html' %}

{% block title %}Calculation Result{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6">
        <div class="card card-custom text-center p-4">
            <div class="stat-icon bg-success-subtle text-success mx-auto mb-3" style="width: 60px; height: 60px; font-size: 1.8rem;">
                <i class="bi bi-check2-circle"></i>
            </div>
            <h4 class="fw-bold mb-2">Calculation Result</h4>
            <div class="display-5 fw-bold text-primary my-3">
                {{ result }}
            </div>
            <div class="d-flex justify-content-center gap-2 mt-3">
                <a href="{% url 'home' %}" class="btn btn-primary px-4">
                    <i class="bi bi-arrow-repeat me-1"></i> Calculate Again
                </a>
                <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary px-4">
                    Student Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
